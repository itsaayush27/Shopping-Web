<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Signup - FASHION STORE</title>
  <link rel="stylesheet" href="CSS/signup.css">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
<link rel="icon" type="image/png" href="https://thumbs.dreamstime.com/b/e-commerce-website-icon-shopping-cart-symbol-traditional-store-awning-e-commerce-website-icon-shopping-cart-symbol-401089826.jpg">
</head>
<body>
  <header>
    <h1>FASHION STORE</h1>
  <nav>
  <a href="index.html">Home</a>
  <a href="shop.html">Shop</a>
  <a href="login.html">Login</a>
  <a href="signup.html">Signup</a>
  <a href="cart.html">Cart</a>
  </nav>
  </header>

  <h2 style="text-align:center; margin:20px;">Signup</h2>
 <form id="signupForm">
  <label for="name">Name:</label>
  <input type="text" id="name" required />
  <small id="nameError" class="error"></small>

  <label for="email">Email:</label>
  <input type="email" id="email" required />
  <small id="emailError" class="error"></small>

  <label for="password">Password:</label>
  <input type="password" id="password" required />
  <small id="passwordError" class="error"></small>

  <label for="confirmPassword">Confirm Password:</label>
  <input type="password" id="confirmPassword" required />
  <small id="confirmPasswordError" class="error"></small>

  <button type="submit">Sign Up</button>
  <p id="error"></p>
</form>
<footer>
  <div class="footer-container">
    <!-- Brand + Description -->
    <div class="footer-brand">
      <h3>FASHION STORE.</h3>
      <p>Your one-stop destination for trending fashion & accessories.</p>
    </div>

    <!-- Contact Info -->
    <div class="footer-contact">
      <h4>Contact</h4>
      <p>Email: support@fashionstore.com</p>
      <p>Phone: +91 123 456 7890</p>
      <div class="social-icons">
        <a href="#" aria-label="Instagram"><i class='bx bxl-instagram' style='color:#bc3535'></i></a>
        <a href="#" aria-label="Facebook"><i class='bx bxl-facebook-circle' style='color:#3b5998'></i></a>
        <a href="#" aria-label="Twitter"><i class='bx bxl-twitter' style='color:#1da1f2'></i></a>
        <a href="#" aria-label="Pinterest"><i class='bx bxl-pinterest' style='color:#bd081c'></i></a>
      </div>
    </div>
  </div>

  <!-- Footer Bottom -->
  <div class="footer-bottom">
    <p>© 2025 FASHION STORE. All rights reserved.</p>
  </div>
</footer>



  <script src="JS/signup.js"></script>
</body>
</html>
